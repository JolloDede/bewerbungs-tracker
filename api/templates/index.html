{% extends "base.html" %}

{% block title %}Index{% endblock %}

{% block content %}
    <h1>Todos</h1>
    <table>
        <thead>
            <tr>
                <th scope="col">Firma</th>
                <th scope="col">Datum</th>
                <th scope="col">Status</th>
            </tr>
        </thead>
        <tbody>
            {% for contact in contacts %}
            <tr >
                <th scope="row">{{ contact.firma }}</th>
                <td
                    {% if contact.age == 2 %}
                        style="background-color: red;"
                    {% else if contact.age == 1 %}
                        style="background-color: yellow;"
                    {% endif %}
                >
                    {{ contact.date }}
                </td>
                <td>
                    <input type="text" name="firma" id="firma" value={{ contact.firma_id }} style="display: none;">
                    <select name="typ" id="typ" hx-post="contact/add" hx-include="#firma" hx-on::after-request="window.location.reload()">
                        {% for typ in types %}
                        <option value={{ typ.key }} {% if typ.value == contact.type %}selected{% endif %}>{{ typ.value }}</option>
                        {% endfor %}
                    </select>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
