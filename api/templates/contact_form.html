{% extends "base.html" %}

{% block title %}Firma neu{% endblock %}

{% block content %}
<form action="" method="post">
    <label>
        <span>Firma:</span>
        <select name="firma" id="firma">
            {% for firma in firmas %}
            <option value={{ firma.id }}>{{ firma.name }}</option>
            {% endfor %}
        </select>
    </label>
    <label>
        <span>Typ:</span>
        <select name="typ" id="typ">
            {% for typ in types %}
            <option value={{ typ.key }}>{{ typ.value }}</option>
            {% endfor %}
        </select>
    </label>
    <input type="submit" value="Speichern">
</form>
{% endblock %}
