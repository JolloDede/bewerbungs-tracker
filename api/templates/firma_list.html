{% extends "base.html" %}

{% block title %}Firma neu{% endblock %}

{% block content %}
<div>
    {% for firma in firmas %}
    <article class="firma">
        <div style: "flex-grow: 1;">
            <h3>{{ firma.name }}</h3>
            <p role="button" class="outline">{{ firma.text }}</p>
        </div>
        <div>
            <button onclick="window.location.href = '/firma/{{ firma.id }}'">Edit</button>
        </div>
    </article>
    {% endfor %}
</div>
{% endblock %}
